<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鸠 · 一点日常</title>
<style>
:root{color-scheme:light;--ink:#41443e;--muted:#899080;--accent:#6c8063;--line:#e7e9df}*{box-sizing:border-box}body{margin:0;background:#f6f6ef;color:var(--ink);font:15px/1.7 "Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 17px;background:#e9eddf;color:var(--ink)}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:wait}.shell{display:flex;max-width:1250px;margin:auto;min-height:100dvh}.sidebar{width:260px;padding:48px 30px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}.brand{font:25px Georgia,serif;letter-spacing:4px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted)}.avatar{width:64px;height:64px;border-radius:24px;background:#e3e8d9;display:grid;place-items:center;font:32px serif;color:var(--accent)}.sidebar p{color:var(--muted);font-size:13px}.sidebuttons{display:grid;gap:10px}.foot{margin-top:auto;color:var(--muted);font-size:11px}.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}header{padding:26px 36px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0;font-weight:500}small{color:var(--muted)}.status{font-size:12px;color:var(--accent)}#messages{flex:1;overflow:auto;padding:35px max(24px,7%);scroll-behavior:smooth}.welcome{max-width:470px;margin:9vh auto 40px;text-align:center}.welcome h2{font-family:serif;font-weight:400;font-size:28px}.welcome p{color:var(--muted);font-size:13px}.suggestions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.suggestions button{font-size:12px;background:#eceee4}.row{margin:0 0 25px;display:flex;flex-direction:column;align-items:flex-start}.row.user{align-items:flex-end}.label{font-size:11px;color:var(--muted);margin:0 5px 7px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;max-width:85%;padding:15px 20px;background:white;border:1px solid #eceee5;border-radius:4px 18px 18px 18px}.user .bubble{background:#e5ebdd;border-color:#e5ebdd;border-radius:18px 4px 18px 18px}form{padding:10px 32px 24px}.composer{display:flex;gap:12px;align-items:flex-end;background:#fff;border:1px solid var(--line);padding:12px;border-radius:18px;box-shadow:0 5px 30px #535e4005}textarea{resize:vertical;min-height:54px;max-height:180px;width:100%;border:0;outline:0;background:transparent;color:var(--ink);padding:8px}#send{background:var(--accent);color:white;flex-shrink:0}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}#error{color:#a34d47;min-height:24px;font-size:12px;padding:0 8px}dialog{border:1px solid var(--line);border-radius:20px;width:min(600px,94vw);padding:28px;background:#f9faf5;color:var(--ink)}dialog::backdrop{background:#30382955}dialog textarea{background:white;border:1px solid var(--line);border-radius:10px;height:140px;font-size:13px}dialog h2{margin-top:0;font-weight:500}dialog p{font-size:12px;color:var(--muted)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.danger{color:#9b5b50}.sr{position:absolute;left:-10000px}@media(max-width:700px){.sidebar{width:76px;padding:28px 12px;align-items:center}.sidebar .brand,.sidebar p,.eyebrow,.foot{display:none}.avatar{width:45px;height:45px;font-size:24px;border-radius:16px}.sidebuttons button{padding:10px 1px;font-size:11px;white-space:nowrap}.sidebuttons{gap:16px}header{padding:20px}.status{font-size:10px}form{padding:8px 12px 14px}.bubble{max-width:95%}#messages{padding:24px 16px}.welcome h2{font-size:23px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="eyebrow">A LITTLE EVERYDAY</div><div class="avatar" aria-hidden="true">鳩</div><div class="brand">小鸠</div><p>把今天的小事，<br>慢慢说给我听吧。</p><div class="sidebuttons"><button id="openMemory">记忆手帐</button><button id="export">导出聊天</button><button id="reset">重新开始</button></div><div class="foot">羽田小鸠 · AI 角色聊天<br>聊天记录保存在本机<br>回复由 DeepSeek 提供</div></aside><main class="main"><header><div><h1>一点日常</h1><small>与小鸠的聊天</small></div><span class="status" id="status">正在连接…</span></header><section id="messages" aria-live="polite" aria-label="聊天记录"></section><form id="form"><div id="error" role="alert"></div><div class="composer"><label class="sr" for="input">给小鸠发消息</label><textarea id="input" placeholder="今天发生了什么？" rows="2" maxlength="6000"></textarea><button id="send">发送 ↗</button></div><div class="hint">Enter 发送 · Shift + Enter 换行 · AI 角色可能记错，可在手帐中修正</div></form></main></div>
<dialog id="memoryDialog"><h2>记忆手帐</h2><p>你希望她记住的事。这里的内容优先作为长期参考；删除后，旧聊天仍可能提及这些事。</p><label for="memory">关于你与相处方式</label><textarea id="memory" maxlength="5000" placeholder="例如：叫我哥哥；我不喜欢碳酸饮料；聊天时少用省略号。"></textarea><p>自动保留最近约 5000 字的用户原话及时间，不提炼或猜测事实。重要事情请移到上面的长期记忆。想彻底忘记旧事，请使用“清空全部”。</p><label for="summary">自动聊天摘记</label><textarea id="summary" maxlength="5000"></textarea><div class="actions"><button id="forget" class="danger">清空全部</button><button id="closeMemory">取消</button><button id="saveMemory">保存</button></div><p id="memoryError" role="alert"></p></dialog>
<script>
let state,busy=false;const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(new URL('api/'+path,document.baseURI),body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function add(role,text,time){const row=document.createElement('div');row.className='row '+role;const label=document.createElement('div');label.className='label';label.textContent=(role==='user'?'你':'小鸠')+(time?' · '+new Date(time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.append(label,bubble);$('messages').append(row);$('messages').scrollTop=$('messages').scrollHeight;return row}
function render(){ $('messages').replaceChildren();if(!state.messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="eyebrow">OUR LITTLE CONVERSATION</div><h2>……哥哥，你来了。</h2><p>不用准备什么话题。<br>今天的一点小事，也想听你说。</p><div class="suggestions"><button type="button">我回来了</button><button type="button">今天有点累</button><button type="button">想和你聊一会儿</button></div>';$('messages').append(w);w.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('input').value=b.textContent;$('input').focus()})}state.messages.forEach(m=>add(m.role,m.content,m.time));$('status').textContent=state.configured?'● DeepSeek Flash':'请配置 API 密钥'}
async function refresh(){state=await api('state');render()}
function setBusy(v){busy=v;['send','reset','openMemory'].forEach(id=>$(id).disabled=v);$('status').textContent=v?'小鸠正在想怎么说…':'● DeepSeek Flash'}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('input').value.trim();if(!text)return;$('error').textContent='';setBusy(true);const welcome=document.querySelector('.welcome');if(welcome)welcome.remove();const pending=add('user',text);$('input').value='';try{await api('chat',{text});await refresh()}catch(e){pending.remove();$('input').value=text;$('error').textContent=e.message}finally{setBusy(false);$('input').focus()}};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
$('openMemory').onclick=()=>{$('memory').value=state.memory;$('summary').value=state.summary;$('memoryError').textContent='';$('memoryDialog').showModal()};$('closeMemory').onclick=()=>$('memoryDialog').close();
$('saveMemory').onclick=async()=>{try{await api('memory',{memory:$('memory').value,summary:$('summary').value});await refresh();$('memoryDialog').close()}catch(e){$('memoryError').textContent=e.message}};
$('reset').onclick=async()=>{if(!confirm('清空聊天记录和自动摘要？手动填写的长期记忆会保留。'))return;try{await api('reset',{});await refresh()}catch(e){$('error').textContent=e.message}};
$('forget').onclick=async()=>{if(!confirm('清空全部聊天、摘要和长期记忆？此操作无法撤销。'))return;try{await api('reset',{forget:true});await refresh();$('memoryDialog').close()}catch(e){$('memoryError').textContent=e.message}};
$('export').onclick=()=>{if(!state)return;const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='小鸠聊天记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
refresh().catch(e=>{$('status').textContent='连接失败';$('error').textContent=e.message});
</script></body></html>
